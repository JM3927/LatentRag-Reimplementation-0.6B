# One 8 GB GPU (8 GB): micro-batch 1 x 16 accumulation = effective batch 16
num_gpus: 1

vllm:
  use_vllm: false

training:
  gradient_accumulation_steps: 16
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  learning_rate: 0.0001

custom_training:

data:
  batch_size: 1 # for evaluation only
